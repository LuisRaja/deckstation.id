<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckStation.id — PRO Audio Repair Specialist</title>
    <meta name="description" content="Independent repair and maintenance service for DJ & Pro Audio equipment in Bali. CDJ, DJM, Technics SL-1200.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #000000;
            --card-bg: rgba(18,18,20,0.7);
            --blue: #ffffff;
            --text: #ffffff;
            --sub: #a0a0a5;
            --border: rgba(255,255,255,0.08);
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            overflow-x: hidden;
        }

        /* ─── HEADER ─── */
        .site-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 12px 40px;
            z-index: 100;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            transition: background 0.3s;
        }

        .site-header:hover {
            background: rgba(0,0,0,0.5);
        }

        .header-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-logo img {
            height: 44px;
            width: auto;
            display: block;
        }

        .header-nav {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-self: center;
        }

        .header-nav a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 14px;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: #fff;
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
        }

        .header-wa {
            justify-self: end;
        }

        .header-wa a {
            background: #25D366;
            color: #fff;
            padding: 6px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .header-wa a:hover {
            background: #1da851;
            transform: translateY(-1px);
        }

        /* ─── HERO (GIF) ─── */
        .hero-gif {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
            background: #000;
        }

        .hero-gif img,
        .hero-gif video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-gif .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(to top, #000 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .scroll-down:hover { color: #fff; }

        .scroll-down .arrow {
            width: 14px; height: 14px;
            border-right: 2px solid rgba(255,255,255,0.5);
            border-bottom: 2px solid rgba(255,255,255,0.5);
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%,20%,50%,80%,100% { transform: translateY(0) rotate(45deg); }
            40% { transform: translateY(6px) rotate(45deg); }
            60% { transform: translateY(3px) rotate(45deg); }
        }

        /* ─── SECOND PAGE ─── */
        .second-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        .second-page-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 0;
        }

        .second-page .sp-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 100px 30px 40px;
            max-width: 900px;
        }

        .second-page .sp-content .label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--blue);
            margin-bottom: 12px;
        }

        .second-page .sp-content h2 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .second-page .sp-content p {
            font-size: 16px;
            color: rgba(255,255,255,0.75);
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto;
        }

        .second-page .sp-content .btn-sp {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 36px;
            background: var(--blue);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .second-page .sp-content .btn-sp:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.3);
        }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 30px;
        }

        .section-sub {
            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 50px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 100px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
        }

        .service-card .img-wrap {
            height: 220px;
            overflow: hidden;
            background: #0a0a0c;
        }

        .service-card .img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .service-card:hover .img-wrap img { transform: scale(1.08); }

        .service-card .body { padding: 30px; }

        .service-card .body h3 {
            font-size: 20px; font-weight: 700;
            margin-bottom: 12px;
        }

        .service-card .body p {
            color: var(--sub); font-size: 14px;
            line-height: 1.7; margin-bottom: 25px;
        }

        .btn-card {
            display: inline-flex;
            align-items: center; gap: 8px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600; font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-card:hover {
            background: var(--blue);
            border-color: var(--blue);
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }

        /* ─── WHY ─── */
        .why-container {
            background: linear-gradient(180deg, rgba(15,15,18,0.8), rgba(5,5,5,0.9));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            margin-bottom: 100px;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
        }

        .why-item { display: flex; flex-direction: column; align-items: flex-start; }

        .why-icon {
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 20px;
        }

        .why-item h4 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .why-item p { color: var(--sub); font-size: 13px; line-height: 1.6; }

        /* ─── CTA ─── */
        .cta-box {
            text-align: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(0,0,0,0.5));
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            padding: 60px 30px;
            margin-bottom: 60px;
        }

        .cta-box h2 { font-size: 32px; font-weight: 800; margin-bottom: 15px; }
        .cta-box p { color: var(--sub); font-size: 16px; margin-bottom: 30px; max-width: 600px; margin: 0 auto 30px; }

        .cta-actions { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }

        .btn-cta-p {
            background: #25D366; color: #fff;
            padding: 14px 32px; border-radius: 8px;
            font-weight: 700; font-size: 15px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37,211,102,0.3);
            transition: all 0.3s ease;
        }

        .btn-cta-p:hover { box-shadow: 0 6px 25px rgba(37,211,102,0.5); transform: translateY(-2px); }

        .btn-cta-s {
            background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 14px 32px; border-radius: 8px;
            font-weight: 600; font-size: 15px;
            text-decoration: none; transition: all 0.3s ease;
        }

        .btn-cta-s:hover { border-color: var(--blue); color: var(--blue); }

        /* ─── FOOTER ─── */
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            color: var(--sub);
            font-size: 13px;
        }
        footer a { color: #fff; text-decoration: none; }

        /* ─── FLOATING WA ─── */
        .float-wa {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            background: #25D366; color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            box-shadow: 0 6px 20px rgba(37,211,102,0.4);
            z-index: 100;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .float-wa:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(37,211,102,0.6); }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 992px) {
            .site-header { padding: 10px 20px; }
            .header-logo img { height: 30px; }
            .header-nav { gap: 4px; }
            .header-nav a { font-size: 10px; padding: 4px 8px; letter-spacing: 0; }
            .header-wa a { font-size: 10px; padding: 4px 12px; }
            .section-title { font-size: 28px; }
            .second-page .sp-content h2 { font-size: 32px; }
        }

        @media (max-width: 640px) {
            .header-nav a { font-size: 9px; padding: 3px 6px; }
            .header-wa { display: none; }
            .site-header { padding: 8px 12px; grid-template-columns: auto 1fr; }
            .header-logo img { height: 28px; }
            .second-page .sp-content h2 { font-size: 24px; }
            .second-page .sp-content p { font-size: 14px; }
            .second-page .sp-content .label { font-size: 11px; }
            .main-content { padding: 50px 15px; }
            .float-wa { width: 50px; height: 50px; font-size: 24px; bottom: 20px; right: 20px; }
        }
    </style>
</head>

</body>
